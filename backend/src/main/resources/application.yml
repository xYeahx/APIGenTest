server:
  port: 8081

spring:
  application:
    name: apigentest-backend

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/apigentest?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: root

  data:
    redis:
      host: localhost
      port: 6379
      database: 0
      timeout: 3s

  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false
    db-config:
      id-type: auto

# 业务自定义配置（开发占位，后续按需调整）
jwt:
  secret: apigentest-dev-secret-please-change-in-production-0123456789
  expire-hours: 24

app:
  upload-dir: ./uploads
  # 敏感配置（LLM API Key）AES 加密密钥：生产环境务必替换为随机长字符串
  crypto-key: apigentest-dev-crypto-key-please-change-2026
  import:
    # SSRF 防护：为 true 时禁止导入内网/保留地址的文档（生产保持 true）
    block-private: true

llm:
  base-url: https://dashscope.aliyuncs.com/compatible-mode/v1
  model: qwen-plus
  timeout-ms: 60000
  max-retry: 2
  temperature: 0.3

logging:
  level:
    com.apigentest: debug